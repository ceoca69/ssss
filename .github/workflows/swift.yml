name: Build Erosion IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Airlift library
        run: |
          echo "=== Airlift files ==="
          find External/AirliftFFI.xcframework -type f -maxdepth 3 -print

          echo ""
          echo "=== File type ==="
          find External/AirliftFFI.xcframework \
            -name "libairlift_ffi.a" \
            -exec file {} \;

          echo ""
          echo "=== Size ==="
          find External/AirliftFFI.xcframework \
            -name "libairlift_ffi.a" \
            -exec ls -lh {} \;

      - name: Make build script executable
        run: chmod +x ipabuild.sh

      - name: Build IPA
        run: ./ipabuild.sh

      - name: Find IPA
        run: |
          echo "Searching for IPA..."
          find . -type f -name "*.ipa" -print

      - name: Verify IPA exists
        run: |
          if ! find . -type f -name "*.ipa" | grep -q .; then
            echo "ERROR: No IPA was produced!"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-IPA
          path: "**/*.ipa"
          if-no-files-found: error
